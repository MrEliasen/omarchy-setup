[ids]
*

[main]
# Cmd keys trigger the cmd layer
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# Caps Lock acts as Cmd.
# Deliberately `leftmeta` and not `layer(cmd)`, despite what `keyd check` says:
# emitting a real leftmeta means Caps also works as SUPER for Hyprland bindings,
# and it still reaches the cmd layer via the [main] mapping above.
capslock = leftmeta

# The `:C` suffix makes this layer emulate Control for anything not explicitly
# bound below, which is what makes Cmd+<anything> behave like Ctrl+<anything>.
#
# NOTE: keyd only treats a `#` as a comment when it starts the line. Trailing
# comments (`a = C-a  # Select all`) are parsed as part of the value and the
# whole binding is silently dropped -- that's why every line in this block used
# to show up as "invalid key or action" in `keyd check`.
[cmd:C]
# Select all
a = C-a
# Copy
c = C-c
# Paste
v = C-v
# Cut
x = C-x
# Undo
z = C-z
# Save
s = C-s
# Find
f = C-f
# Close tab
w = C-w
# New tab
t = C-t
# Quit
q = C-q

[cmd]
# Text navigation (Mac-like)
left = home
right = end

# Selection (Cmd+Shift+Arrow). This needs a composite layer, not `shift+left`:
# in keyd, `+` on the left-hand side means a *chord* (keys struck together), and
# `shift` isn't even a valid key name (it's leftshift/rightshift), so keyd
# rejected both lines with "shift is not a valid key". Composite layers must be
# declared after the layers they're made of, so this block stays at the bottom.
[cmd+shift]
left = S-home
right = S-end
