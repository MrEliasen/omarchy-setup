# Per-app overrides, applied by keyd-application-mapper.
#
# Cmd+Left/Right are home/end globally (see /etc/keyd/default.conf), which is
# right for GUI apps but not for a shell -- readline's beginning/end-of-line are
# C-a and C-e. Overriding them here is what resolves that: no need to pick one
# behaviour for both. Safe because tmux's prefix is C-Space, not C-a.

[alacritty]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.left = C-a
cmd.right = C-e

[com-mitchellh-ghostty]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.t = C-S-t
cmd.w = C-S-w
cmd.leftbrace = C-S-tab
cmd.rightbrace = C-tab
cmd.left = C-a
cmd.right = C-e
